<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSpacePro - Masuk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --input-border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .auth-container {
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        .auth-brand {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-badge {
            background: #eff6ff;
            color: var(--primary-blue);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .auth-title span {
            color: var(--primary-blue);
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.75rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 0.85rem;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            border-color: var(--primary-blue);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-primary-blue {
            background: var(--primary-blue);
            color: #fff;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary-blue:hover {
            background: var(--primary-hover);
        }

        .btn-primary-blue:active {
            transform: scale(0.98);
        }

        .divider-container {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #9ca3af;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider-container::before,
        .divider-container::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--input-border);
        }

        .divider-container span {
            padding: 0 10px;
        }

        .btn-google {
            background: #fff;
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background: #f9fafb;
        }

        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-brand">
            <span class="brand-badge">WorkSpace Pro</span>
        </div>
        
        <h2 class="auth-title">Selamat <span>Datang</span></h2>
        <p class="auth-subtitle">Masuk untuk mengakses platform evaluasi kinerja karyawan.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Alamat Email</label>
                <input type="email" id="loginEmail" required placeholder="nama@perusahaan.com">
            </div>

            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" id="loginPassword" required placeholder="Masukkan kata sandi" minlength="6">
            </div>

            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Ingat saya
                </label>
                <a href="#" class="forgot-password">Lupa kata sandi?</a>
            </div>

            <button type="submit" class="btn-primary-blue">Masuk ke Dashboard</button>
        </form>

        <div class="divider-container">
            <span>Atau</span>
        </div>

        <button type="button" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.14C3.21 21.36 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.61H1.2C.43 8.15 0 9.88 0 12s.43 3.85 1.2 5.39l4.08-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.21 2.64 1.2 6.61l4.08 3.14c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>
            Masuk dengan Google
        </button>

        <div class="auth-footer">
            Belum punya akun? <a href="#" id="authToggleLink">Daftar sekarang</a>
        </div>
    </div>

</body>
</html>
